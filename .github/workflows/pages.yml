name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shorts-react/package-lock.json
      - name: Build shorts-react
        working-directory: shorts-react
        run: |
          npm ci
          npm run build
      # 기존 정적 페이지는 그대로 두고, React 앱만 /shorts-react/ 아래에 얹는다.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='node_modules' --exclude='shorts-react' --exclude='.claude' ./ _site/
          mkdir _site/shorts-react
          cp -R shorts-react/dist/. _site/shorts-react/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
