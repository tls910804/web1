name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shorts-react/package-lock.json
      - name: Build shorts-react
        working-directory: shorts-react
        run: |
          npm ci
          npm test
          npm run build
      # AI 전화 서버 규칙 테스트 (의존성 없이 돌아가요). 실패하면 배포를 멈춰요.
      - name: Test ai-call-worker policy
        run: node --experimental-strip-types --test ai-call-worker/src/policy.test.ts
      # 기존 정적 페이지는 그대로 두고, React 앱만 /app/ 아래에 얹는다.
      # 작업용 파일(참고 이미지·메모·스크립트·서버 코드)은 사이트에 올리지 않는다.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='node_modules' --exclude='shorts-react' --exclude='.claude' \
            --exclude='참고자료' --exclude='docs' --exclude='tools' --exclude='ai-call-worker' --exclude='HANDOFF.md' --exclude='CLAUDE.md' --exclude='README.md' --exclude='.DS_Store' ./ _site/
          mkdir _site/app
          cp -R shorts-react/dist/. _site/app/
          # 음성 파일은 R2(audio.langshorts.com)에서 받아요. 목록(manifest.json)만 사이트에 남겨요 (tools/audio/upload_r2.sh로 먼저 올리기)
          find _site/app/audio -name '*.m4a' -delete
          # 예전 주소(/shorts-react/)는 새 주소로 보내요. 같은 사이트라 기기 기록(localStorage)은 그대로예요
          mkdir _site/shorts-react
          printf '<!doctype html><meta charset="utf-8"><title>Langshorts</title><script>location.replace("/app/"+location.search+location.hash)</script><a href="/app/">langshorts.com/app</a>\n' > _site/shorts-react/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 올린 파일이 GitHub 목록에 늦게 나타나 배포가 "파일 없음"으로 실패한 적이 있어서 잠깐 기다려요
      - name: Wait for artifact
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
