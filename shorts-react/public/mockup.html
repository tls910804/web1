<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문장 쇼츠 · 폰 목업</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#e9ebf0;font-family:system-ui,sans-serif}
/* 390x844 화면: 상태바 54 + 앱 770 + 홈 인디케이터 20. 창이 작으면 비율을 유지한 채 줄어든다 */
.phone{width:430px;height:884px;flex:none;position:relative;box-sizing:border-box;padding:20px;border-radius:64px;background:#0a0a0a;box-shadow:0 0 0 2px #3a3a3a inset,0 30px 80px rgba(0,0,0,.35)}
.screen{width:390px;height:844px;border-radius:46px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column}
.status{flex:none;height:54px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 38px;box-sizing:border-box;background:#fff;color:#0a0a0a}
.status b{font:600 16px/1 -apple-system,"SF Pro Text",system-ui,sans-serif}
.status .island{position:absolute;left:50%;top:11px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#0a0a0a}
.status .r{display:flex;gap:6px;align-items:center}
.status svg{display:block}
iframe{flex:none;width:390px;height:770px;border:0;display:block}
.home{flex:none;height:20px;background:#fff;display:flex;align-items:center;justify-content:center}
.home i{width:134px;height:5px;border-radius:3px;background:#0a0a0a}
</style></head><body>
<div class="phone"><div class="screen">
  <div class="status"><b>9:41</b><span class="island"></span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#0a0a0a"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0"/><path d="M4 7a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="#0a0a0a" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#0a0a0a" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="#0a0a0a"/><path d="M25 4.5v4c.9-.3 1.5-1.2 1.5-2s-.6-1.7-1.5-2z" fill="#0a0a0a" opacity=".4"/></svg>
    </span>
  </div>
  <iframe src="./index.html" title="문장 쇼츠"></iframe>
  <div class="home"><i></i></div>
</div></div>
<script>
const p=document.querySelector(".phone");
function fit(){p.style.zoom=Math.min(1,(innerHeight-48)/884,(innerWidth-48)/430)}
addEventListener("resize",fit);fit();
</script>
</body></html>
